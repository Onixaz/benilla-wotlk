[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["sam <samuv.eth@gmail.com>"]

# A version two crates share is pinned in `[workspace.dependencies]`; feature additions stay per
# crate. `image` stays per-crate: its consumers differ on default features, and a member cannot
# turn off default features that a workspace entry enables.
# `too_many_arguments` is off: a Bevy system's parameter list is its dependency declaration.
[workspace.lints.clippy]
too_many_arguments = "allow"

[workspace.dependencies]
anyhow = "1.0.102"
# bevy's default features spelled out without `audio`: `2d`, `3d` and `ui` each pull `bevy_audio`
# and `vorbis`, and the client mixes through kira. Add a feature by name, never `2d`/`3d`/`ui`; a
# plugin that takes bevy with its default features brings the audio stack back too.
bevy = { version = "0.18.1", default-features = false, features = [
    "default_app",
    "default_platform",
    "2d_bevy_render",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "scene",
    "picking",
] }
# For the `WOW_GPU_MS` meter's query set, which bevy 0.18 does not wrap; must match bevy's wgpu.
wgpu = "27"
clap = { version = "4.6.1", features = ["derive"] }
sha1 = "0.10.6"

# lua-src builds the addon VM's Lua 5.1.5, upstream's sources, as 3.3.5a embeds stock 5.1; the
# reference facts and the command that checks them: `third_party/lua-src/BENILLA.md`.
[patch.crates-io]
lua-src = { path = "third_party/lua-src" }
# kira 0.12.4, patched to compute spatial gains and the volume tween per output chunk and
# interpolate them, not per sample frame (`third_party/kira/BENILLA.md`).
kira = { path = "third_party/kira" }

# Dependencies at opt-level 3 in dev: at opt-level 0, avian/parry collision drops a run to <1 fps.
[profile.dev.package."*"]
opt-level = 3
# One codegen unit each: `lto = "off"` below drops the ThinLTO that inlined across a crate's units.
codegen-units = 1

# Our crates at opt-level 1: Bevy's generic hot paths monomorphize into them, and at opt-level 0
# Stormwind drops from a pinned 60 fps to ~45.
[profile.dev]
opt-level = 1
# No ThinLTO: above opt-level 0 rustc runs it over a crate's own units and an incremental rebuild
# redoes it whole; off, a one-constant `benilla-app` edit rebuilds in 92 s against 185 (Windows).
lto = "off"

# No debuginfo trimming: `debug = "line-tables-only"` measures no recurring win on macOS + sccache.

# `release` is the measured and the shipped profile: fat LTO over one codegen unit measures
# -0.43 ms a frame (-6 %) at Northshire Abbey against thin-local LTO, and the player's fps is the
# benchmark. The cost is the link: a full build 32 min against 23, a one-crate relink minutes
# longer; the iteration loop and every probe run is `cargo play`, and `--release` is built to
# measure or to ship. `-Ctarget-cpu=native` is not set: it is not portable.
[profile.release]
lto = "fat"
codegen-units = 1

# The former shipping profile, now `release` itself; kept so `--profile ship` still builds.
[profile.ship]
inherits = "release"

# `release` plus incremental, run as `cargo play`: under `release` a one-line edit to
# `benilla-app` costs 2m47s. Incremental applies to workspace members only, so dependencies stay
# sccache-cacheable; it changes codegen, so it lives here and not in the measured `release`.
[profile.play]
inherits = "release"
incremental = true
# Not for speed: under `incremental`, thin-local LTO leaves promoted `anon.*.llvm.*` symbols
# unresolved and the link fails intermittently (rustc #86049).
lto = "off"
# `release`'s own default before it went to one unit: one unit per crate would make every
# incremental edit a whole-crate codegen.
codegen-units = 16

# Dependencies at one codegen unit, as in `release`: the 16 above is for our crates' incremental
# edits. A one-constant `benilla-app` edit rebuilds in 82 s against 93, and Northshire Abbey
# frames 7.6 ms against 8.0.
[profile.play.package."*"]
codegen-units = 1
