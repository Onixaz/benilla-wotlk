[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["sam <samuv.eth@gmail.com>"]

# A version two crates share is pinned in `[workspace.dependencies]`; feature additions stay per
# crate. `image` stays per-crate: its consumers differ on default features, and a member cannot
# turn off default features that a workspace entry enables.
# `too_many_arguments` is off: a Bevy system's parameter list is its dependency declaration.
[workspace.lints.clippy]
too_many_arguments = "allow"

[workspace.dependencies]
anyhow = "1.0.102"
# bevy's default features spelled out without `audio`: `2d`, `3d` and `ui` each pull `bevy_audio`
# and `vorbis`, and the client mixes through kira. Add a feature by name, never `2d`/`3d`/`ui`; a
# plugin that takes bevy with its default features brings the audio stack back too.
bevy = { version = "0.18.1", default-features = false, features = [
    "default_app",
    "default_platform",
    "2d_bevy_render",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "scene",
    "picking",
    # Names systems and parameters in ECS diagnostics (else "Enable the debug feature to see the
    # name"), which `benilla-worldview` reports; in every build, so dev and player share Bevy.
    "debug",
] }
# For the `WOW_GPU_MS` meter's query set, which bevy 0.18 does not wrap; must match bevy's wgpu.
wgpu = "27"
clap = { version = "4.6.1", features = ["derive"] }
sha1 = "0.10.6"

# lua-src builds the addon VM's Lua 5.1.5, upstream's sources, as 3.3.5a embeds stock 5.1; the
# reference facts and the command that checks them: `third_party/lua-src/BENILLA.md`.
[patch.crates-io]
lua-src = { path = "third_party/lua-src" }
# kira 0.12.4, patched to compute spatial gains and the volume tween per output chunk and
# interpolate them, not per sample frame (`third_party/kira/BENILLA.md`).
kira = { path = "third_party/kira" }

# Two builds. `dev` is the play build: every run, probe, test and gate builds it, so they share one
# set of compiled artifacts. `release` is built, never tested: to ship (`cargo ship`) or to measure.

# Optimized as a run needs it, incremental for our crates.
[profile.dev]
opt-level = 3
# Not for speed: under `incremental`, thin-local LTO leaves promoted `anon.*.llvm.*` symbols
# unresolved and the link fails intermittently (rustc #86049).
lto = "off"
# Sixteen units a crate: one would make every incremental edit a whole-crate codegen.
codegen-units = 16
# Line tables, so a failing test's backtrace names its lines.
debug = "line-tables-only"
# Our crates keep `dev`'s debug assertions and overflow checks: the `debug_assert!` sites and the
# audio thread's no-allocation guard run in every test and every probe.

# Dependencies as `release` builds them: at opt-level 0 avian/parry collision drops a run to <1 fps,
# and at 16 codegen units Northshire Abbey frames 8.0 ms against 7.6.
[profile.dev.package."*"]
opt-level = 3
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = false

# The audio thread's no-allocation guard: under its `disable_release` default it checks only with
# debug assertions of its own.
[profile.dev.package.assert_no_alloc]
debug-assertions = true

# `release` is the shipped and the measured profile: fat LTO over one codegen unit measures
# -0.43 ms a frame (-6 %) at Northshire Abbey against thin-local LTO, and the player's fps is the
# benchmark. The cost is the link, a full build 32 min against 23, so it is built to ship or to
# measure, never per round. `-Ctarget-cpu=native` is not set: it is not portable.
[profile.release]
lto = "fat"
codegen-units = 1
