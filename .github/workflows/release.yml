# The release build, `cargo ship`, on every release tag and on demand. Release is built, never
# tested: the gates test the same code in `dev`, and this catches what only fat LTO can break, the
# link.
name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ship:
    runs-on: ubuntu-latest
    # A cold fat-LTO build takes 33 min on 12 threads; the runner has two cores.
    timeout-minutes: 300
    env:
      CARGO_TERM_COLOR: always
      # Two jobs and swap, as ci.yml: the fat-LTO link holds the whole program in memory.
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Swap
        run: >-
          sudo fallocate -l 16G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile
          && sudo swapon /mnt/swapfile
      - name: System libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libasound2-dev libudev-dev
      - name: Toolchain
        run: rustup toolchain install && rustc -V
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: ship
        run: cargo ship
