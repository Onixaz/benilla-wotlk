# cargo-about's config for THIRD-PARTY-LICENSES, the notices a release archive carries beside the
# binary: `scripts/release/package.sh`. A license here is one a dependency of the player build may
# ship under; for an `OR` expression the first listed that the crate offers is the one taken.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "BSD-1-Clause",
    "0BSD",
    "ISC",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "bzip2-1.0.6",
]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
ignore-dev-dependencies = true
