# `cargo play` runs the client, the build every probe and test shares; `cargo ship` builds the
# player's binary, `release` without `dev`. Env vars still prefix them:
# `WOW_USER=<account> WOW_PASS=<password> cargo play`.
[alias]
play = "run -p benilla"
ship = "build --release -p benilla --no-default-features"
