# `cargo play` builds and runs the player's binary, without `dev`, on the `play` profile; `cargo ship`
# builds it on `release`. `cargo dev` (or `cargo debug`) runs `dev`, the build every probe and test
# shares.
# Env vars still prefix them: `WOW_USER=<account> WOW_PASS=<password> cargo play`.
[alias]
play = "run --profile play -p benilla --no-default-features"
dev = "run -p benilla"
debug = "run -p benilla"
ship = "build --release -p benilla --no-default-features"
