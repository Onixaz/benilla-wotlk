# `cargo play` builds and runs the player's binary, without `dev`, on the `play` profile (`release`
# with `BENILLA_PGO_LTO=fat`), with the local PGO profile when `scripts/pgo-train.sh` has recorded
# one; `cargo ship` builds the shipped drop-in on `release`, the player build with `standalone`, which
# goes beside `Wow.exe`. `cargo dev` (or `cargo debug`) runs `dev`, the build every probe and test
# shares.
# Env vars still prefix them: `WOW_USER=<account> WOW_PASS=<password> cargo play`.
[alias]
play = "run -q -p benilla-xtask -- play"
dev = "run -p benilla"
debug = "run -p benilla"
ship = "build --release -p benilla --no-default-features --features standalone"
