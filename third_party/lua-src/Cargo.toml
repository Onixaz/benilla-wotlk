# A fork of the `lua-src` crate (MIT, github.com/mlua-rs/lua-src-rs), pinned to the version mlua
# 0.11 asks for. Its Lua 5.1.5 sources are upstream's unchanged: 3.3.5a embeds stock Lua 5.1.
# `BENILLA.md` gives the reference facts and the one command that verifies the sources against the
# registry copy; a change the reference's VM makes to stock 5.1 lands here as a listed hunk.
#
# The crate's own `src/lib.rs` is upstream's, with Lua 5.2 to 5.5 stripped from the `Version` enum
# and their trees deleted, so asking for another version is a compile error here rather than a
# missing directory at build time.
[package]
name = "lua-src"
version = "550.0.0"
authors = ["Aleksandr Orlenko <zxteam@protonmail.com>"]
edition = "2024"
repository = "https://github.com/mlua-rs/lua-src-rs"
license = "MIT"
description = """
Sources of Lua 5.1 and logic to build them — benilla's fork, see the header and BENILLA.md.
"""

[features]
ucid = [] # accept UniCode IDentifiers (upstream's; inert here, it only ever gated 5.4/5.5)

[dependencies]
cc = "1.2"
